<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d4ef"/>
      <stop offset="1" stop-color="#7fb0df"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8edf2"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c5867"/>
      <stop offset="1" stop-color="#15191f"/>
    </linearGradient>
    <style>
      .title{font:700 46px Arial,Helvetica,sans-serif;fill:#05080c}
      .subtitle{font:700 24px Arial,Helvetica,sans-serif;fill:#10151b}
      .body{font:400 23px Arial,Helvetica,sans-serif;fill:#111820}
      .small{font:400 18px Arial,Helvetica,sans-serif;fill:#111820}
      .tiny{font:700 13px Arial,Helvetica,sans-serif;fill:#10151b}
      .white{fill:#fff}
      .bold{font-weight:700}
      .panel{fill:url(#panel);stroke:#111820;stroke-width:2}
      .darkpanel{fill:url(#dark);stroke:#111820;stroke-width:2}
      .pedal{fill:#d7e5f3;stroke:#406d91;stroke-width:8}
      .knob{fill:#ffe8a7;stroke:#111820;stroke-width:5}
      .knob2{fill:#89817e;stroke:#111820;stroke-width:5}
      .switch{fill:#64a6df;stroke:#111820;stroke-width:4}
      .led{fill:#63aee7;stroke:#6f8ea9;stroke-width:8}
      .line{stroke:#111820;stroke-width:3;fill:none}
    </style>
  </defs>

  <rect width="1240" height="1754" fill="#f7f8fa"/>

  <rect x="36" y="32" width="524" height="124" fill="url(#header)" stroke="#5d7fa4" stroke-width="2"/>
  <text x="58" y="82" class="title">Looper</text>
  <text x="58" y="119" class="subtitle">Stereo / Mono Grain Looper</text>
  <text x="58" y="148" class="small">MIDI clock quantize + bar metronome</text>

  <rect x="722" y="52" width="462" height="130" fill="url(#header)" stroke="#5d7fa4" stroke-width="2"/>
  <text x="746" y="91" class="subtitle">Stereo In/Out</text>
  <text x="746" y="124" class="body">Max: 120s stereo</text>
  <text x="746" y="156" class="body">DIP3 mono: 240s</text>

  <!-- Pedal body -->
  <rect x="400" y="220" width="440" height="620" rx="18" class="pedal"/>
  <polygon points="508,204 525,170 542,204" fill="#111820"/>
  <polygon points="720,170 737,204 754,170" fill="#111820"/>

  <rect x="430" y="280" width="126" height="260" fill="#c7d9e9" stroke="#111820" stroke-width="2"/>
  <rect x="557" y="280" width="126" height="260" fill="#c7d9e9" stroke="#111820" stroke-width="2"/>
  <rect x="684" y="280" width="126" height="260" fill="#c7d9e9" stroke="#111820" stroke-width="2"/>

  <circle cx="493" cy="345" r="42" class="knob"/>
  <line x1="493" y1="345" x2="493" y2="304" stroke="#111820" stroke-width="6"/>
  <text x="462" y="415" class="tiny">Mix</text>
  <text x="453" y="438" class="tiny">Shift Age</text>

  <circle cx="620" cy="345" r="42" class="knob"/>
  <line x1="620" y1="345" x2="620" y2="304" stroke="#111820" stroke-width="6"/>
  <text x="584" y="415" class="tiny">Speed</text>
  <text x="570" y="438" class="tiny">Metro Vol</text>

  <circle cx="747" cy="345" r="42" class="knob"/>
  <line x1="747" y1="345" x2="747" y2="304" stroke="#111820" stroke-width="6"/>
  <text x="715" y="415" class="tiny">Gain</text>
  <text x="720" y="438" class="tiny">0-2</text>

  <circle cx="493" cy="495" r="42" class="knob2"/>
  <line x1="493" y1="495" x2="493" y2="454" stroke="#111820" stroke-width="6"/>
  <text x="462" y="564" class="tiny">Size</text>
  <text x="438" y="586" class="tiny">Shift Space</text>

  <circle cx="620" cy="495" r="42" class="knob2"/>
  <line x1="620" y1="495" x2="620" y2="454" stroke="#111820" stroke-width="6"/>
  <text x="589" y="564" class="tiny">Pitch</text>
  <text x="571" y="586" class="tiny">Tempo / Rnd</text>

  <circle cx="747" cy="495" r="42" class="knob2"/>
  <line x1="747" y1="495" x2="747" y2="454" stroke="#111820" stroke-width="6"/>
  <text x="710" y="564" class="tiny">FDBK</text>
  <text x="721" y="586" class="tiny">0-1</text>

  <circle cx="493" cy="640" r="24" class="switch"/>
  <path d="M468 640 h32" stroke="#111820" stroke-width="7"/>
  <text x="452" y="704" class="tiny" transform="rotate(-90 452 704)">Metro reset</text>

  <circle cx="620" cy="640" r="24" class="switch"/>
  <path d="M595 640 h32" stroke="#111820" stroke-width="7"/>
  <text x="579" y="704" class="tiny" transform="rotate(-90 579 704)">3/4 Off 4/4</text>

  <circle cx="747" cy="640" r="24" class="switch"/>
  <path d="M722 640 h32" stroke="#111820" stroke-width="7"/>
  <text x="706" y="704" class="tiny" transform="rotate(-90 706 704)">2x 1x 0.5x</text>

  <text x="527" y="762" font-family="Georgia,serif" font-size="44" font-weight="700" fill="#05080c">LOOPER</text>
  <text x="548" y="792" class="small">PURE CLOCK</text>
  <circle cx="493" cy="775" r="43" class="led"/>
  <circle cx="747" cy="775" r="43" class="led"/>
  <text x="452" y="833" class="tiny">LED1</text>
  <text x="430" y="855" class="tiny">OD / CLK</text>
  <text x="706" y="833" class="tiny">LED2</text>
  <text x="694" y="855" class="tiny">LOOP / WARN</text>

  <!-- Left panels -->
  <rect x="36" y="228" width="326" height="172" class="panel"/>
  <text x="58" y="266" class="subtitle">Knobs</text>
  <text x="58" y="305" class="body"><tspan class="bold">SW2 M:</tspan> Grain knobs</text>
  <text x="58" y="338" class="body"><tspan class="bold">K2:</tspan> Speed / Metro vol</text>
  <text x="58" y="371" class="body"><tspan class="bold">K5:</tspan> Pitch / Metro tempo</text>
  <path d="M362 330 C380 330 384 345 400 345" class="line"/>

  <rect x="36" y="426" width="326" height="172" class="panel"/>
  <text x="58" y="464" class="subtitle">Footswitches</text>
  <text x="58" y="503" class="body"><tspan class="bold">FS1:</tspan> OD / Shift hold</text>
  <text x="58" y="536" class="body"><tspan class="bold">FS2:</tspan> Loop control</text>
  <text x="58" y="569" class="body"><tspan class="bold">Ext:</tspan> OD/Undo + Loop</text>
  <path d="M362 536 C382 550 388 745 400 775" class="line"/>

  <rect x="64" y="632" width="304" height="164" class="darkpanel"/>
  <text x="90" y="672" class="subtitle white">Switch 1</text>
  <text x="90" y="710" class="body white"><tspan class="bold">L:</tspan> Reverse</text>
  <text x="90" y="744" class="body white"><tspan class="bold">M:</tspan> Forward</text>
  <text x="90" y="778" class="body white"><tspan class="bold">R:</tspan> Grain Mode</text>
  <path d="M368 714 C386 704 390 650 400 642" class="line"/>

  <rect x="64" y="824" width="304" height="164" class="darkpanel"/>
  <text x="90" y="864" class="subtitle white">Switch 2</text>
  <text x="90" y="902" class="body white"><tspan class="bold">L:</tspan> Metro 3/4</text>
  <text x="90" y="936" class="body white"><tspan class="bold">M:</tspan> Metro off / free</text>
  <text x="90" y="970" class="body white"><tspan class="bold">R:</tspan> Metro 4/4</text>
  <path d="M368 910 C386 890 392 650 400 642" class="line"/>

  <!-- Right panels -->
  <rect x="878" y="238" width="326" height="178" class="panel"/>
  <text x="900" y="278" class="subtitle">Switch 3</text>
  <text x="900" y="316" class="body"><tspan class="bold">L:</tspan> Double speed</text>
  <text x="900" y="350" class="body"><tspan class="bold">M:</tspan> Normal speed</text>
  <text x="900" y="384" class="body"><tspan class="bold">R:</tspan> Half speed</text>
  <path d="M878 330 C858 330 850 650 840 642" class="line"/>

  <rect x="878" y="448" width="326" height="200" class="panel"/>
  <text x="900" y="488" class="subtitle">LED 1</text>
  <text x="900" y="526" class="body">On: overdub active</text>
  <text x="900" y="560" class="body">MIDI clock: inverse pulse</text>
  <text x="900" y="594" class="body">Off + clock: short flash</text>
  <text x="900" y="628" class="small">DIP2 on: no MIDI blink</text>

  <rect x="878" y="1048" width="326" height="178" class="panel"/>
  <text x="900" y="1088" class="subtitle">Grain / Shift</text>
  <text x="900" y="1126" class="small"><tspan class="bold">SW2 M:</tspan> K1 Mix, K2 Speed</text>
  <text x="900" y="1156" class="small">K4 Size, K5 Pitch</text>
  <text x="900" y="1186" class="small"><tspan class="bold">SW2 L/R:</tspan> K2 Vol, K5 BPM</text>
  <text x="900" y="1216" class="small">Shift: K1/K2/K4/K5 grain random</text>

  <rect x="878" y="680" width="326" height="178" class="darkpanel"/>
  <text x="900" y="720" class="subtitle white">DIP</text>
  <text x="900" y="758" class="body white"><tspan class="bold">1:</tspan> MISO on</text>
  <text x="900" y="792" class="body white"><tspan class="bold">2:</tspan> Ignore MIDI</text>
  <text x="900" y="826" class="body white"><tspan class="bold">3:</tspan> Mono long</text>
  <text x="900" y="852" class="small white"><tspan class="bold">4:</tspan> Metro eighths</text>
  <path d="M878 760 C860 760 856 780 840 792" class="line"/>

  <rect x="878" y="878" width="326" height="150" fill="#4c6178" stroke="#111820" stroke-width="2"/>
  <text x="900" y="916" class="subtitle white">LED 2</text>
  <text x="900" y="952" class="body white">Dim: rec / quant wait</text>
  <text x="900" y="984" class="body white">Bright: loop running</text>
  <text x="900" y="1016" class="small white">3x inverse: limit reached</text>

  <rect x="878" y="1238" width="326" height="178" class="panel"/>
  <text x="900" y="1278" class="subtitle">External FSW</text>
  <text x="900" y="1316" class="small"><tspan class="bold">1k:</tspan> Overdub, hold Undo</text>
  <text x="900" y="1346" class="small"><tspan class="bold">2k2:</tspan> same as FS2 Loop</text>
  <text x="900" y="1376" class="small">Both 100 ms: clear content</text>
  <text x="900" y="1406" class="small">Both 600 ms: full reset</text>

  <!-- Main guide -->
  <rect x="40" y="1040" width="820" height="594" fill="#eef4f9" stroke="#111820" stroke-width="3"/>
  <text x="70" y="1092" class="title">Loop Bedienung</text>
  <text x="70" y="1134" class="body"><tspan class="bold">Loop aus:</tspan> erster FS2-Press setzt Start. Release wird ignoriert.</text>
  <text x="70" y="1170" class="body"><tspan class="bold">Recording:</tspan> naechster FS2-Press setzt Ende oder Stop-Wunsch.</text>
  <text x="70" y="1206" class="body"><tspan class="bold">Playing:</tspan> kurz FS2 = halbieren. Ab 250 ms = verdoppeln.</text>

  <rect x="70" y="1240" width="520" height="330" class="panel"/>
  <text x="96" y="1282" class="subtitle">Quantize / Metro</text>
  <text x="96" y="1324" class="body"><tspan class="bold">3/4:</tspan> 72 MIDI ticks / bar</text>
  <text x="96" y="1360" class="body"><tspan class="bold">4/4:</tspan> 96 MIDI ticks / bar</text>
  <text x="96" y="1396" class="body">Ende nur auf:</text>
  <text x="96" y="1432" class="body">1, 2, 4, 8, 16, 32, 64 bars</text>
  <text x="96" y="1490" class="small">DIP4 an: Metro klickt Achtel statt Viertel.</text>
  <text x="96" y="1526" class="small">Beat 1: hoher Klick. Kein Start: Loop-Start.</text>

  <rect x="628" y="1240" width="220" height="330" class="panel"/>
  <text x="654" y="1282" class="subtitle">Limits / Warnung</text>
  <text x="654" y="1324" class="small"><tspan class="bold">Stereo:</tspan> 120s</text>
  <text x="654" y="1360" class="small"><tspan class="bold">Mono:</tspan> 240s</text>
  <text x="654" y="1396" class="small">FS2 3s clear</text>
  <text x="654" y="1432" class="small">FS2 5s reset</text>
  <text x="654" y="1468" class="small">Limit: LED2 3x inv.</text>
  <text x="654" y="1526" class="small">Stop nimmt letzten Quant.</text>

  <rect x="70" y="1588" width="1078" height="34" fill="#dbe8f4" stroke="#111820" stroke-width="1"/>
  <text x="92" y="1612" class="small"><tspan class="bold">Shift:</tspan> FS1 600 ms toggelt Shift. LED1 gedimmt. K2 Direction/Pos, K4 Space/Age, K5 Pitch Random.</text>

  <rect x="40" y="1662" width="1160" height="58" fill="#203040"/>
  <text x="64" y="1700" class="body white">Looper - stereo/mono grain looper, MIDI clock quantize, internal bar metronome.</text>
</svg>
